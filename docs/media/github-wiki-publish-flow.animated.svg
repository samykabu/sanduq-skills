<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 858" role="img" aria-labelledby="github-wiki-publish-flow-title github-wiki-publish-flow-desc"><title id="github-wiki-publish-flow-title">Publishing to a GitHub wiki</title><desc id="github-wiki-publish-flow-desc">The skill first resolves the destination wiki, the pages, the source files and what you allowed it to publish. It uses a connector when one can write wiki pages; otherwise it clones the wiki repository fresh and finds its real default branch. It maps pages and assets, rewrites links and leaves unrelated pages alone, commits only those paths after reviewing the diff, then fetches and pushes without ever force-pushing. A rejected push gets one fetch and merge; the same conflict again stops the run with the clone kept. It then checks the commit on the remote and, with a signed-in browser, the served page.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--muted)}.lb{fill:var(--muted)}.e{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.dash{stroke-dasharray:5 4}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}@media (prefers-reduced-motion: no-preference){.s{animation:rv 480ms cubic-bezier(.2,.8,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.s1{animation-delay:0ms}.s2{animation-delay:480ms}.s3{animation-delay:960ms}.s4{animation-delay:1440ms}.s5{animation-delay:1920ms}}</style><rect class="bg" width="1000" height="858"/><g class="s s1"><text class="e" x="40" y="36" font-size="12">GITHUB-WIKI-PUBLISH · ONE BOUNDED UPDATE</text><rect x="140" y="56" width="320" height="58" rx="6" class="box"/><text x="300" y="81" text-anchor="middle" font-size="16" font-weight="600">Resolve the destination</text><text class="m" x="300" y="100" text-anchor="middle" font-size="12">wiki, pages, sources, what you allowed</text></g><g class="s s2"><path class="c" d="M300 114 V150" marker-end="url(#ar)"/><polygon points="300,152 450,200 300,248 150,200" class="focal"/><text x="300" y="196" text-anchor="middle" font-size="15" font-weight="600">Connector can write?</text><text class="m" x="300" y="214" text-anchor="middle" font-size="12">wiki pages and assets</text><path class="c" d="M450 200 H638" marker-end="url(#ar)"/><text class="lb" x="462" y="192" font-size="12" text-anchor="start">yes</text><rect x="640" y="171" width="320" height="58" rx="6" class="box"/><text x="800" y="196" text-anchor="middle" font-size="16" font-weight="600">Publish through it</text><text class="m" x="800" y="215" text-anchor="middle" font-size="12">same mapping and checks</text></g><g class="s s3"><path class="c" d="M300 248 V298" marker-end="url(#ar)"/><text class="lb" x="310" y="272" font-size="12" text-anchor="start">no</text><rect x="140" y="300" width="320" height="58" rx="6" class="box"/><text x="300" y="325" text-anchor="middle" font-size="16" font-weight="600">Fresh clone of the wiki repo</text><text class="m" x="300" y="344" text-anchor="middle" font-size="12">find its real default branch</text><path class="c" d="M300 358 V384" marker-end="url(#ar)"/><rect x="140" y="386" width="320" height="58" rx="6" class="box"/><text x="300" y="411" text-anchor="middle" font-size="16" font-weight="600">Map pages and assets</text><text class="m" x="300" y="430" text-anchor="middle" font-size="12">rewrite links, keep unrelated pages</text><path class="c" d="M300 444 V470" marker-end="url(#ar)"/><rect x="140" y="472" width="320" height="58" rx="6" class="box"/><text x="300" y="497" text-anchor="middle" font-size="16" font-weight="600">Commit only those paths</text><text class="m" x="300" y="516" text-anchor="middle" font-size="12">review the full diff first</text><path class="c" d="M300 530 V556" marker-end="url(#ar)"/><rect x="140" y="558" width="320" height="58" rx="6" class="focal"/><text x="300" y="583" text-anchor="middle" font-size="16" font-weight="600">Fetch, then push</text><text class="m" x="300" y="602" text-anchor="middle" font-size="12">never force-push</text></g><g class="s s4"><path class="lk" d="M460 578 H638" marker-end="url(#arl)"/><text class="lb" x="472" y="570" font-size="12" text-anchor="start">rejected</text><rect x="640" y="550" width="320" height="66" rx="6" class="box"/><text x="800" y="570" text-anchor="middle" font-size="16" font-weight="600">Fetch and merge once</text><text class="m" x="800" y="589" text-anchor="middle" font-size="12">same conflict again: stop,</text><text class="m" x="800" y="605" text-anchor="middle" font-size="12">keep the clone, report</text></g><path class="lk" d="M800 550 V501 H462" marker-end="url(#arl)"/><text class="lb" x="812" y="541" font-size="12" text-anchor="start">retry</text><g class="s s5"><path class="c" d="M300 616 V656" marker-end="url(#ar)"/><rect x="140" y="658" width="320" height="58" rx="6" class="box"/><text x="300" y="683" text-anchor="middle" font-size="16" font-weight="600">Verify the remote commit</text><text class="m" x="300" y="702" text-anchor="middle" font-size="12">the push really landed</text><path class="c" d="M300 716 V742" marker-end="url(#ar)"/><rect x="140" y="744" width="320" height="58" rx="6" class="box"/><text x="300" y="769" text-anchor="middle" font-size="16" font-weight="600">Check the served page</text><text class="m" x="300" y="788" text-anchor="middle" font-size="12">signed-in browser: text, links, images</text><text class="lb" x="40" y="836" font-size="12" text-anchor="start">You get the page URL, the published revision, what changed and anything it could not check.</text></g></svg>
