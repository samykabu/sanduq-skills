<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 526" role="img" aria-labelledby="product-map-title product-map-desc"><title id="product-map-title">Six skills in three bundles</title><desc id="product-map-desc">illustration-tools holds illustrate; dev-tools holds user-manual and github-wiki-publish; agent-tools holds delegate-task, progress-report and planning-majlis. user-manual draws with illustrate when it is installed, and planning-majlis can run its critics through delegate-task. Every skill also works on its own. The samykabu/sanduq repository lists the three bundles in its plugin marketplace and copies illustrate, user-manual, delegate-task and progress-report into its Spec Kit extensions.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--muted)}.lb{fill:var(--muted)}.e{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.dash{stroke-dasharray:5 4}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}@media (prefers-reduced-motion: no-preference){.s{animation:rv 480ms cubic-bezier(.2,.8,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.s1{animation-delay:0ms}.s2{animation-delay:480ms}.s3{animation-delay:960ms}.s4{animation-delay:1440ms}.s5{animation-delay:1920ms}.s6{animation-delay:2400ms}}</style><rect class="bg" width="960" height="526"/><g class="s s1"><rect x="20" y="40" width="920" height="260" rx="8" class="zone"/><text class="e" x="40" y="70" font-size="12">SANDUQ-SKILLS · 6 SKILLS IN 3 BUNDLES · EACH BUNDLE IS ONE PLUGIN</text></g><g class="s s2"><rect x="40" y="96" width="280" height="104" rx="6" class="box"/><text x="180" y="135" text-anchor="middle" font-size="16" font-weight="600">illustration-tools</text><text class="m" x="180" y="154" text-anchor="middle" font-size="12">illustrate</text><text class="m" x="180" y="170" text-anchor="middle" font-size="12">44 diagram and chart types</text></g><g class="s s3"><rect x="340" y="96" width="280" height="104" rx="6" class="box"/><text x="480" y="126" text-anchor="middle" font-size="16" font-weight="600">dev-tools</text><text class="m" x="480" y="145" text-anchor="middle" font-size="12">user-manual</text><text class="m" x="480" y="161" text-anchor="middle" font-size="12">github-wiki-publish</text><text class="m" x="480" y="177" text-anchor="middle" font-size="12">manuals and wiki publishing</text></g><g class="s s4"><rect x="640" y="96" width="280" height="104" rx="6" class="box"/><text x="780" y="126" text-anchor="middle" font-size="16" font-weight="600">agent-tools</text><text class="m" x="780" y="145" text-anchor="middle" font-size="12">delegate-task</text><text class="m" x="780" y="161" text-anchor="middle" font-size="12">progress-report</text><text class="m" x="780" y="177" text-anchor="middle" font-size="12">planning-majlis</text></g><g class="s s5"><path class="c opt" d="M410 200 V234 H180 V202" marker-end="url(#ar)"/><text class="lb" x="192" y="252" font-size="12" text-anchor="start">user-manual draws with illustrate when installed</text><text class="lb" x="640" y="230" font-size="12" text-anchor="start">planning-majlis can run its critics</text><text class="lb" x="640" y="246" font-size="12" text-anchor="start">through delegate-task</text></g><g class="s s6"><path class="lk" d="M480 300 V354" marker-end="url(#arl)"/><rect x="300" y="356" width="360" height="80" rx="6" class="box"/><text x="480" y="383" text-anchor="middle" font-size="16" font-weight="600">samykabu/sanduq</text><text class="m" x="480" y="402" text-anchor="middle" font-size="12">marketplace lists the 3 bundles</text><text class="m" x="480" y="418" text-anchor="middle" font-size="12">Spec Kit extensions copy 4 skills</text></g><g class="s s6"><line x1="20" y1="470" x2="940" y2="470" class="zone"/><path class="c opt" d="M40 498 H80" marker-end="url(#ar)"/><text class="lb" x="90" y="502" font-size="12" text-anchor="start">uses when installed</text><path class="lk" d="M260 498 H300" marker-end="url(#arl)"/><text class="lb" x="310" y="502" font-size="12" text-anchor="start">listed by, or copied into</text></g></svg>
