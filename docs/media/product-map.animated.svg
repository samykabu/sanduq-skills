<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1140 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product-map-title product-map-desc">
      <title id="product-map-title">Sanduq Skills product map</title>
      <desc id="product-map-desc">Three plugin bundles: dev-tools holds the user-manual skill, whose API, release, screenshot and preview instructions are references it loads on demand, the core uses illustrate from illustration-tools for diagrams when it is installed, and agent-tools holds delegate-task on its own.</desc>
      <defs><style data-illustrate-animation="true">.ia-draw,.ia-flow{opacity:0;fill:none}.ia-flow{stroke-dasharray:3 14;stroke-linecap:round}.ia-dot,.ia-chev{display:none}@keyframes ia-draw-fwd{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-rev{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:-1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-both{0%{opacity:1;stroke-dasharray:0 1;stroke-dashoffset:-.5}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-hidden{0%,100%{opacity:0}}@keyframes ia-show{from{opacity:0}to{opacity:.9}}@keyframes ia-march{to{stroke-dashoffset:-17}}@keyframes ia-march-px{to{stroke-dashoffset:-17}}@keyframes ia-travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion: no-preference){.ia-draw.ia-a0{animation:ia-draw-fwd 600ms ease-out 0ms backwards}[data-ia="0"]{animation:ia-hidden 600ms}.ia-draw.ia-a1{animation:ia-draw-fwd 600ms ease-out 450ms backwards}[data-ia="1"]{animation:ia-hidden 1050ms}.ia-draw.ia-a2{animation:ia-draw-fwd 600ms ease-out 900ms backwards}[data-ia="2"]{animation:ia-hidden 1500ms}.ia-draw.ia-a3{animation:ia-draw-fwd 600ms ease-out 1350ms backwards}[data-ia="3"]{animation:ia-hidden 1950ms}.ia-draw.ia-a4{animation:ia-draw-fwd 600ms ease-out 1800ms backwards}[data-ia="4"]{animation:ia-hidden 2400ms}.ia-dot{display:inline;offset-rotate:0deg;animation:ia-travel 2400ms ease-in-out infinite}.ia-chev{display:inline;offset-rotate:auto;animation:ia-travel 2400ms linear infinite}.ia-rev{animation-direction:reverse}.ia-chev.ia-rev{offset-rotate:auto 180deg}}</style>
        <style>
          svg { color: #4f6078; }
          .bg, .mask { fill: #f6f8fc; }
          .box { fill: #ffffff; stroke: #15233c; }
          .core { fill: #e9effc; stroke: #2563eb; }
          .zone { fill: rgba(21,35,60,0.03); stroke: #c7d2e2; }
          .tag { fill: none; stroke: rgba(21,35,60,0.40); }
          .rule { stroke: rgba(21,35,60,0.12); }
          .ink { fill: #15233c; }
          .muted { fill: #4f6078; }
          .accent { fill: #2563eb; }
          .lnk { color: #1d4ed8; }
          .mk { fill: #4f6078; }
          .mk-link { fill: #1d4ed8; }
          .sans { font-family: system-ui, sans-serif; }
          .mono { font-family: ui-monospace, monospace; }
          @media (prefers-color-scheme: dark) {
            svg { color: #b6c2d4; }
            .bg, .mask { fill: #101827; }
            .box { fill: #17233a; stroke: #f5f7fb; }
            .core { fill: #1b2c4d; stroke: #6ea0ff; }
            .zone { fill: rgba(245,247,251,0.03); stroke: #40506a; }
            .tag { stroke: rgba(245,247,251,0.40); }
            .rule { stroke: rgba(245,247,251,0.12); }
            .ink { fill: #f5f7fb; }
            .muted { fill: #b6c2d4; }
            .accent { fill: #6ea0ff; }
            .lnk { color: #8ab4ff; }
            .mk { fill: #b6c2d4; }
            .mk-link { fill: #8ab4ff; }
          }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon class="mk" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon class="accent" points="0 0, 8 3, 0 6"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon class="mk-link" points="0 0, 8 3, 0 6"/>
        </marker>
      </defs>

