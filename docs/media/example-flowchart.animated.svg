<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <defs><style data-illustrate-animation="true">.ia-draw,.ia-flow{opacity:0;fill:none}.ia-flow{stroke-dasharray:3 14;stroke-linecap:round}.ia-dot,.ia-chev{display:none}@keyframes ia-draw-fwd{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-rev{0%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:-1}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-draw-both{0%{opacity:1;stroke-dasharray:0 1;stroke-dashoffset:-.5}99.9%{opacity:1;stroke-dasharray:1 1;stroke-dashoffset:0}100%{opacity:0}}@keyframes ia-hidden{0%,100%{opacity:0}}@keyframes ia-show{from{opacity:0}to{opacity:.9}}@keyframes ia-march{to{stroke-dashoffset:-17}}@keyframes ia-march-px{to{stroke-dashoffset:-17}}@keyframes ia-travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion: no-preference){.ia-draw.ia-a0{animation:ia-draw-fwd 600ms ease-out 0ms backwards}[data-ia="0"]{animation:ia-hidden 600ms}.ia-flow.ia-a0{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a1{animation:ia-draw-fwd 600ms ease-out 425ms backwards}[data-ia="1"]{animation:ia-hidden 1025ms}.ia-flow.ia-a1{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a2{animation:ia-draw-fwd 600ms ease-out 850ms backwards}[data-ia="2"]{animation:ia-hidden 1450ms}.ia-flow.ia-a2{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a3{animation:ia-draw-fwd 600ms ease-out 1275ms backwards}[data-ia="3"]{animation:ia-hidden 1875ms}.ia-flow.ia-a3{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a4{animation:ia-draw-fwd 600ms ease-out 1700ms backwards}[data-ia="4"]{animation:ia-hidden 2300ms}.ia-flow.ia-a4{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a5{animation:ia-draw-fwd 600ms ease-out 2125ms backwards}[data-ia="5"]{animation:ia-hidden 2725ms}.ia-flow.ia-a5{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a6{animation:ia-draw-fwd 600ms ease-out 2550ms backwards}[data-ia="6"]{animation:ia-hidden 3150ms}.ia-flow.ia-a6{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-draw.ia-a7{animation:ia-draw-fwd 600ms ease-out 2975ms backwards}[data-ia="7"]{animation:ia-hidden 3575ms}.ia-flow.ia-a7{animation:ia-show 300ms 3575ms both,ia-march 2000ms linear 3575ms infinite normal}.ia-dot{display:inline;offset-rotate:0deg;animation:ia-travel 2400ms ease-in-out infinite}.ia-chev{display:inline;offset-rotate:auto;animation:ia-travel 2400ms linear infinite}.ia-rev{animation-direction:reverse}.ia-chev.ia-rev{offset-rotate:auto 180deg}}</style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Step -->
        <line data-ia="0" x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a0" pathLength="1" aria-hidden="true"/><line x1="500" y1="88" x2="500" y2="120" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a0" aria-hidden="true"/>
        <!-- Step → Diamond 1 -->
        <line data-ia="1" x1="500" y1="168" x2="500" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="168" x2="500" y2="192" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a1" pathLength="1" aria-hidden="true"/><line x1="500" y1="168" x2="500" y2="192" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a1" aria-hidden="true"/>
        <!-- Diamond 1 "NO" right -->
        <line data-ia="2" x1="600" y1="240" x2="720" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="600" y1="240" x2="720" y2="240" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a2" pathLength="1" aria-hidden="true"/><line x1="600" y1="240" x2="720" y2="240" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a2" aria-hidden="true"/>
        <!-- Diamond 1 "YES" down -->
        <line data-ia="3" x1="500" y1="288" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="500" y1="288" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a3" pathLength="1" aria-hidden="true"/><line x1="500" y1="288" x2="500" y2="328" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a3" aria-hidden="true"/>
        <!-- Diamond 2 "NO" right -->
        <line data-ia="4" x1="600" y1="376" x2="720" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="600" y1="376" x2="720" y2="376" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a4" pathLength="1" aria-hidden="true"/><line x1="600" y1="376" x2="720" y2="376" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a4" aria-hidden="true"/>
        <!-- Diamond 2 "YES" down (coral — happy path) -->
        <line data-ia="5" x1="500" y1="424" x2="500" y2="464" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/><line x1="500" y1="424" x2="500" y2="464" stroke="#eb6c36" stroke-width="1.4" class="ia-draw ia-a5" pathLength="1" aria-hidden="true"/><line x1="500" y1="424" x2="500" y2="464" stroke="#eb6c36" stroke-width="2.4" class="ia-flow ia-a5" aria-hidden="true"/>

        <!-- Arrow labels -->
        <rect x="644" y="230" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="298" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="644" y="366" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="434" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="443" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New workflow</text>

        <!-- Rectangle: Step -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Do it manually once</text>

        <!-- Diamond 1: Repeated >3 times? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Will you repeat</text>
        <text x="500" y="252" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">it >3 times?</text>

        <!-- End oval: One-off -->
        <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One-off</text>
        <text x="800" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep manual</text>

        <!-- Diamond 2: Reusable across projects? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="374" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reusable across</text>
        <text x="500" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">projects?</text>

        <!-- End oval: CLAUDE.md note -->
        <rect x="720" y="352" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLAUDE.md note</text>
        <text x="800" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">project-scoped</text>

        <!-- End oval: Write a skill (coral focal) -->
        <rect x="420" y="464" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="500" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write a skill</text>
        <text x="500" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reusable + assets</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,578 424,572 436,578 424,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line data-ia="6" x1="604" y1="580" x2="632" y2="580" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/><line x1="604" y1="580" x2="632" y2="580" stroke="#eb6c36" stroke-width="1.4" class="ia-draw ia-a6" pathLength="1" aria-hidden="true"/><line x1="604" y1="580" x2="632" y2="580" stroke="#eb6c36" stroke-width="2.4" class="ia-flow ia-a6" aria-hidden="true"/>
        <text x="640" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>

        <line data-ia="7" x1="768" y1="580" x2="796" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="768" y1="580" x2="796" y2="580" stroke="#4f5d75" stroke-width="1.2" class="ia-draw ia-a7" pathLength="1" aria-hidden="true"/><line x1="768" y1="580" x2="796" y2="580" stroke="#eb6c36" stroke-width="2.2" class="ia-flow ia-a7" aria-hidden="true"/>
        <text x="804" y="582" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
      </svg>
