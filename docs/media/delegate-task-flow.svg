<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="delegate-task-flow-title delegate-task-flow-desc"><title id="delegate-task-flow-title">A delegate-task run</title><desc id="delegate-task-flow-desc">start hands one task to another agent CLI and returns a run id straight away; the harness runs in the background while you keep working. collect --wait N waits up to N seconds; if the run is still going it says so and you collect again later. A finished run returns a status of successful, failed or abandoned with the reason for it, the files git measured next to the files the delegate claimed, and the tokens used. You review it and keep or discard the change, or resume the same session with only the change you want, which starts a new run linked to its parent. Resume needs a finished run with a session id, on the same harness, folder, CLI version and model.</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mh" d="M0 1 L7 4 L0 7"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="mhl" d="M0 1 L7 4 L0 7"/></marker></defs><style>svg{--paper:#f6f8fc;--paper2:#ffffff;--ink:#15233c;--muted:#4f6078;--soft:#6b7a90;--rule:#c7d2e2;--accent:#2563eb;--tint:rgba(37,99,235,0.09);--link:#1d4ed8}@media (prefers-color-scheme: dark){svg{--paper:#101827;--paper2:#17233a;--ink:#f5f7fb;--muted:#b6c2d4;--soft:#8796ac;--rule:#40506a;--accent:#6ea0ff;--tint:rgba(110,160,255,0.14);--link:#8ab4ff}}text{font-family:'IBM Plex Sans', system-ui, sans-serif;fill:var(--ink)}.m{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--muted)}.lb{fill:var(--muted)}.e{font-family:'IBM Plex Mono', ui-monospace, monospace;fill:var(--soft);letter-spacing:.08em}.bg{fill:var(--paper)}.zone{fill:none;stroke:var(--rule)}.box{fill:var(--paper2);stroke:var(--rule)}.focal{fill:var(--tint);stroke:var(--accent)}.dash{stroke-dasharray:5 4}.c{fill:none;stroke:var(--muted);stroke-width:1.5}.opt{stroke-dasharray:5 4}.lk{fill:none;stroke:var(--link);stroke-width:1.5}.mh{fill:none;stroke:var(--muted)}.mhl{fill:none;stroke:var(--link)}</style><rect class="bg" width="1000" height="420"/><g class="s s1"><text class="e" x="40" y="40" font-size="12">DELEGATE-TASK · ONE TASK ON ANOTHER AGENT CLI</text><rect x="40" y="70" width="250" height="70" rx="6" class="box"/><text x="165" y="92" text-anchor="middle" font-size="16" font-weight="600">start</text><text class="m" x="165" y="111" text-anchor="middle" font-size="12">returns a run_id at once</text><text class="m" x="165" y="127" text-anchor="middle" font-size="12">--harness codex, claude, ...</text></g><g class="s s2"><path class="c" d="M290 105 H373" marker-end="url(#ar)"/><rect x="375" y="70" width="250" height="70" rx="6" class="focal"/><text x="500" y="92" text-anchor="middle" font-size="16" font-weight="600">Harness runs</text><text class="m" x="500" y="111" text-anchor="middle" font-size="12">in the background</text><text class="m" x="500" y="127" text-anchor="middle" font-size="12">you keep working</text></g><g class="s s3"><path class="c" d="M625 105 H708" marker-end="url(#ar)"/><rect x="710" y="70" width="250" height="70" rx="6" class="box"/><text x="835" y="101" text-anchor="middle" font-size="16" font-weight="600">collect --wait N</text><text class="m" x="835" y="120" text-anchor="middle" font-size="12">waits up to N seconds</text><path class="c" d="M900 70 V48 H770 V68" marker-end="url(#ar)"/><text class="lb" x="835" y="42" font-size="12" text-anchor="middle">still running: collect again later</text></g><g class="s s4"><path class="c" d="M835 140 V248" marker-end="url(#ar)"/><text class="lb" x="845" y="190" font-size="12" text-anchor="start">finished</text><rect x="710" y="250" width="250" height="96" rx="6" class="box"/><text x="835" y="276" text-anchor="middle" font-size="16" font-weight="600">Result</text><text class="m" x="835" y="295" text-anchor="middle" font-size="12">status and why (provenance)</text><text class="m" x="835" y="311" text-anchor="middle" font-size="12">files git measured vs claimed</text><text class="m" x="835" y="327" text-anchor="middle" font-size="12">tokens used</text></g><g class="s s5"><path class="c" d="M710 298 H627" marker-end="url(#ar)"/><rect x="375" y="263" width="250" height="70" rx="6" class="box"/><text x="500" y="285" text-anchor="middle" font-size="16" font-weight="600">You review it</text><text class="m" x="500" y="304" text-anchor="middle" font-size="12">read the diff and the checks</text><text class="m" x="500" y="320" text-anchor="middle" font-size="12">never trust exit code alone</text></g><g class="s s6"><path class="c" d="M375 298 H292" marker-end="url(#ar)"/><text class="lb" x="304" y="290" font-size="12" text-anchor="start">good</text><rect x="40" y="263" width="250" height="70" rx="6" class="box"/><text x="165" y="294" text-anchor="middle" font-size="16" font-weight="600">Keep or discard</text><text class="m" x="165" y="313" text-anchor="middle" font-size="12">the change is yours to commit</text><path class="lk" d="M500 263 V142" marker-end="url(#arl)"/><text class="lb" x="510" y="170" font-size="12" text-anchor="start">needs a fix: --resume &lt;run_id&gt;</text><text class="lb" x="510" y="186" font-size="12" text-anchor="start">only the delta; a new run_id</text></g><g class="s s6"><text class="lb" x="40" y="380" font-size="12" text-anchor="start">status: starting, running, stalled, adrift (supervisor died, harness alive), lost (both gone), done</text><text class="lb" x="40" y="398" font-size="12" text-anchor="start">Resume needs a finished run with a session id, on the same harness, folder, CLI version and model.</text></g></svg>
