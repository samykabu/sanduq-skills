name: release

# Tag a bundle as <bundle>-vX.Y.Z (for example illustration-tools-v3.2.1). The tag must match the
# bundle's plugin.json version. samykabu/sanduq picks the release up daily (its vendor-update
# workflow vendors the skill, repins the marketplace entry and opens a pull request).
on:
  push:
    tags: ['*-v*.*.*']

permissions:
  contents: write
  actions: read # the CI gate reads ci.yml runs

jobs:
  release:
    runs-on: homek8-general
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # Publish only a commit that main's ci passed: ci runs on pushes to main only, so a successful push run
      # for the tagged sha proves both. A run still going is waited for (up to 30 minutes).
      - name: Require a successful ci run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")]')
            if [ "$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
              echo "ci passed on main for $GITHUB_SHA"; exit 0
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -eq 0 ]; then
              echo "::error::No successful ci push run on main for $GITHUB_SHA; nothing published. Merge the commit to main, wait for ci to pass, then re-run this workflow."
              exit 1
            fi
            echo "ci for $GITHUB_SHA is still running (check $attempt of 60)"; sleep 30
          done
          echo "::error::ci for $GITHUB_SHA did not finish within 30 minutes; nothing published. Re-run this workflow once it passes."
          exit 1
      - name: Check tag against plugin.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          bundle="${tag%-v*}"
          version="${tag##*-v}"
          manifest="skills/${bundle}/.claude-plugin/plugin.json"
          test -f "$manifest" || { echo "no bundle $bundle"; exit 1; }
          test "$(jq -r .version "$manifest")" = "$version" || { echo "tag $version != plugin.json"; exit 1; }
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build bundle archive
        env:
          BUNDLE: ${{ steps.meta.outputs.bundle }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bundle="$BUNDLE"; version="$VERSION"
          (cd skills && zip -qr "../${bundle}-v${version}.zip" "$bundle" -x '*/node_modules/*' '*/__pycache__/*' '*/tests/*')
          # One archive per skill folder (SKILL.md at its root) for Claude Desktop uploads.
          for skill in skills/"$bundle"/skills/*/; do
            name="$(basename "$skill")"
            cp skills/"$bundle"/LICENSE "$skill"
            # Only bundles with third-party material carry notices.
            if [ -f skills/"$bundle"/THIRD_PARTY_NOTICES.md ]; then cp skills/"$bundle"/THIRD_PARTY_NOTICES.md "$skill"; fi
            (cd skills/"$bundle"/skills && zip -qr "../../../${name}-v${version}.zip" "$name" -x '*/node_modules/*' '*/__pycache__/*' '*/test/*')
          done
          sha256sum *.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Commit: $GITHUB_SHA"
