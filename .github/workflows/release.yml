name: release

# Tag a bundle as <bundle>-vX.Y.Z (for example illustration-tools-v3.2.1). The tag must match the
# bundle's plugin.json version. The release then opens a pin-update PR in samykabu/sanduq, which
# vendors the skill and hosts the marketplace entry.
on:
  push:
    tags: ['*-v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PIN_TOKEN: ${{ secrets.SANDUQ_PIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against plugin.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          bundle="${tag%-v*}"
          version="${tag##*-v}"
          manifest="skills/${bundle}/.claude-plugin/plugin.json"
          test -f "$manifest" || { echo "no bundle $bundle"; exit 1; }
          test "$(jq -r .version "$manifest")" = "$version" || { echo "tag $version != plugin.json"; exit 1; }
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build bundle archive
        run: |
          bundle="${{ steps.meta.outputs.bundle }}"; version="${{ steps.meta.outputs.version }}"
          (cd skills && zip -qr "../${bundle}-v${version}.zip" "$bundle" -x '*/node_modules/*' '*/__pycache__/*' '*/tests/*')
          # One archive per skill folder (SKILL.md at its root) for Claude Desktop uploads.
          for skill in skills/"$bundle"/skills/*/; do
            name="$(basename "$skill")"
            cp skills/"$bundle"/LICENSE skills/"$bundle"/THIRD_PARTY_NOTICES.md "$skill"
            (cd skills/"$bundle"/skills && zip -qr "../../../${name}-v${version}.zip" "$name" -x '*/node_modules/*' '*/__pycache__/*' '*/test/*')
          done
          sha256sum *.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Commit: $GITHUB_SHA"
      - name: Open pin update in samykabu/sanduq
        if: env.PIN_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PIN_TOKEN }}
        run: |
          gh workflow run vendor-update.yml --repo samykabu/sanduq \
            -f bundle="${{ steps.meta.outputs.bundle }}" -f ref="$GITHUB_REF_NAME" -f sha="$GITHUB_SHA"
